# GitHub Actions 云构建 APK（本机无需安卓 SDK / Java / WSL）
# 触发方式:  push 标签 v*  或  在 Actions 页面点 "Run workflow"
# 产物:      Artifacts 里的 mctc-apk（*arm64-v8a-debug.apk）
name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 本仓库根目录即 MCTC_Android 内容（main.py / buildozer.spec 在根）
      - name: Build APK with Buildozer
        id: buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: .
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mctc-apk
          path: ${{ steps.buildozer.outputs.filename }}
          if-no-files-found: error
