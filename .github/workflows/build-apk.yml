# GitHub Actions 云构建 APK（本机无需安卓 SDK / Java / WSL）
# 触发方式:  push 标签 v*  或  在 Actions 页面点 "Run workflow"
# 产物:      Artifacts 里的 mctc-apk（bin/*.apk）
#
# 关键坑（均已处理）:
# 1) 原 Docker 容器 action (ArtemSBulgakov/buildozer-action) 的 Dockerfile 写死 ppa:openjdk-r/ppa，
#    新版 Ubuntu 已无该 PPA 的 Release 文件 → apt update 404 → 镜像构建失败。故改为原生 runner 手动构建。
# 2) buildozer 1.6.0 的 android.accept_licenses=True 不会自动接受 build-tools 的许可，
#    sdkmanager 装包时仍弹 "Accept? (y/N)" 并跳过 → SDK 不全、出不了 APK。故显式 yes | sdkmanager --licenses。
# 3) buildozer ... | tee 的管道退出码是 tee 的(恒 0)，会掩盖失败。故用 set -o pipefail，且上传 if: success()。
# 4) 固定 p4a 到新版本后，其自带 AGP 8.x + Gradle 8.14.3 必须用 Java 17 运行；
#    但 ubuntu-22.04 runner 默认 java 是 temurin-11，故显式把 JAVA_HOME 指到 Java 17，
#    并写进 PATH，否则 gradle daemon 起不来 (报错 "Android Gradle plugin requires Java 17")。
name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git unzip zip \
            openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            ccache
          # AGP 8.x / Gradle 8 必须用 Java 17 运行；强制把 JAVA_HOME 指到 Java 17
          # (优先 apt 装的 openjdk-17，回退到 runner 自带的 temurin-17)，并写进 PATH
          JVM=$(ls -d /usr/lib/jvm/java-17-openjdk* 2>/dev/null | head -1)
          [ -z "$JVM" ] && JVM=$(ls -d /usr/lib/jvm/temurin-17* 2>/dev/null | head -1)
          echo "Resolved JAVA17_HOME=$JVM"
          echo "JAVA_HOME=$JVM" >> "$GITHUB_ENV"
          echo "$JVM/bin" >> "$GITHUB_PATH"
          java -version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer==1.6.0" "cython==0.29.33"

      - name: Bootstrap SDK & accept Android licenses
        run: |
          SDK=$HOME/.buildozer/android/platform/android-sdk
          # 第一次 buildozer 会下载并落地 SDK/NDK（许可未接受会中途停，忽略错误）
          buildozer android debug >/tmp/bootstrap.log 2>&1 || true
          # 显式接受所有 Android SDK 许可（两种 sdkmanager 路径都试，避免版本差异）
          yes | "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" --licenses || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses || true

      - name: Build APK (buildozer android debug)
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer_build.log

      - name: Diagnose manifest on failure
        if: failure()
        run: |
          echo "===== generated AndroidManifest.xml (if any) ====="
          M=$(find .buildozer -name AndroidManifest.xml -path '*src/main*' 2>/dev/null | head -1)
          if [ -n "$M" ]; then
            echo "FILE: $M"
            cat "$M"
          else
            echo "(manifest not found; listing dist tree)"
            find .buildozer -maxdepth 6 -name '*.xml' 2>/dev/null | head
          fi
          echo "===== gradle --stacktrace for the SAX cause ====="
          DIST=$(find .buildozer -maxdepth 6 -type d -name mctctest 2>/dev/null | head -1)
          if [ -n "$DIST" ] && [ -f "$DIST/gradlew" ]; then
            cd "$DIST"
            ./gradlew processDebugMainManifest --stacktrace 2>&1 | tail -60 || true
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mctc-apk
          path: bin/*.apk
          if-no-files-found: error
